    <!-- FORMULARIO -->
    <section class="section fade-in">

                class="contact-form card-glass">
                <input type="text" name="nombre" placeholder="Nombre completo" required>
                <input type="email" name="email" placeholder="Correo electrónico" required>
                <textarea name="mensaje" placeholder="Describe brevemente tu caso" required></textarea>
                <button type="submit" class="btn-primary btn-hover">Enviar Consulta</button>
                <p id="formSuccess" class="success-message">Tu mensaje fue enviado correctamente. Me pondré en contacto
                    contigo pronto.</p>
            </form>
        </div>
